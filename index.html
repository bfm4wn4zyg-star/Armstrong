/* Dashboard information-density and table alignment refinement */
body,button,input,select,textarea{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
table{line-height:1.5}
thead th{padding:12px 16px;background:#f5f7fa;color:#333;font-size:12px;font-weight:600;border-bottom:1px solid #cfd5dd}
tbody td{padding:12px 16px}
.overview-table,.gate-table{width:100%;table-layout:fixed}

.series-sizes{display:flex;flex-wrap:wrap;gap:8px;max-width:none}

    m=core.match(/^风筝厂 · (.+)$/);if(m)return lead+'Kite Factory · '+m[1]+trail;
    m=core.match(/^当前仅展示 (.+) 的不同尺寸 \/ 版本；点击任一行查看PM录入的事实详情$/);if(m)return lead+'Showing only '+m[1]+' sizes / versions. Click a row to view the PM-recorded details.'+trail;

    m=core.match(/^(.+) · (\d+)个尺寸\/型号 · (只读|PM维护) · 更新 (.+)$/);if(m)return lead+m[1]+' · '+m[2]+' sizes / models · '+(m[3]==='只读'?'Read-only':'PM maintained')+' · Updated '+m[4]+trail;
    m=core.match(/^(.+) · (\d+)个尺寸\/型号 · 项目跟进人 (.+)$/);if(m)return lead+m[1]+' · '+m[2]+' sizes / models · Project owner '+m[3]+trail;
    m=core.match(/^(.+) · (\d+)个尺寸\/型号 · (.+)$/);if(m)return lead+m[1]+' · '+m[2]+' sizes / models · '+m[3]+trail;
    m=core.match(/^(.+) · (\d+)个尺寸\/型号$/);if(m)return lead+m[1]+' · '+m[2]+' sizes / models'+trail;
    m=core.match(/^已等待：(\d+)天$/);if(m)return lead+'Waiting: '+m[1]+' days'+trail;
    m=core.match(/^提交：(.+)$/);if(m)return lead+'Submitted: '+m[1]+trail;
    m=core.match(/^确认：(.+) · 需要 (.+)$/);if(m)return lead+'Approver: '+m[1]+' · Needed by '+m[2]+trail;

    m=core.match(/^状态：(.+)$/);if(m){var st=en[m[1]]||m[1];return lead+'Status: '+st+trail;}

  function clone(x){return JSON.parse(JSON.stringify(x));}
  function loadRecords(key,seed,isValid){
    try{
      var raw=localStorage.getItem(key);
      if(raw===null)return clone(seed);
      var value=JSON.parse(raw);
      if(Array.isArray(value)&&value.every(isValid))return value;
      unreadableRecords.add(key);
    }catch(e){
      if(e instanceof SyntaxError)unreadableRecords.add(key);
    }
    return clone(seed);
  }
  function loadSeries(){
    function validMilestone(m){return m&&typeof m.name==='string';}
    return loadRecords(SERIES_STORE,SERIES_SEED,function(p){
      return p&&typeof p.name==='string'&&typeof p.id==='string'
        &&Array.isArray(p.variants)&&p.variants.every(function(v){return v&&typeof v.name==='string'&&typeof v.node==='string'&&(!Array.isArray(v.milestones)||v.milestones.every(validMilestone));})
        &&Array.isArray(p.approvals)&&p.approvals.every(function(a){return a&&typeof a==='object';})
        &&Array.isArray(p.milestones)&&p.milestones.every(validMilestone)
        &&Array.isArray(p.samples)&&p.samples.every(Array.isArray);
    });
  }
  function localDateString(){
    return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  }
  function calendarDay(value){
    var match=/^(\d{4})([-/])(\d{2})\2(\d{2})$/.exec(String(value||''));
    if(!match)return null;
    var date=match[1]+'-'+match[3]+'-'+match[4],time=Date.parse(date+'T00:00:00Z');
    return Number.isFinite(time)&&new Date(time).toISOString().slice(0,10)===date?time/86400000:null;
  }
  function dayDiff(from,to){
    var start=calendarDay(from),end=calendarDay(to);
    return start===null||end===null?null:Math.max(0,end-start);
  }
  function waitingDays(a){return a.status==='待确认'?dayDiff(a.submitted,localDateString()):null;}
  function overdueDays(a){return a.status==='待确认'?dayDiff(a.needed,localDateString()):null;}
  function waitingLabel(days){return days===null?'—':days+'天';}
  function confirmationTitle(a){
    if(a.question) return a.question;
    if(a.kind==='测试异常处理') return '测试异常处理（'+a.scope+'）：是否接受次品率超标的现有数据？';
    if(a.kind==='铺层确认') return '铺层确认（'+a.scope+'）：是否批准当前铺层方案？';
    if(a.kind==='材料确认') return '材料确认（'+a.scope+'）：最终材料采用哪一方案？';
    return a.kind+'（'+a.scope+'）：请确认当前方案';
  }
  function milestoneProgress(items){
    var applicable=(items||[]).filter(function(m){return m.status!=='不适用';});
    if(!applicable.length)return 0;
    var completed=applicable.filter(function(m){return m.status==='已完成';}).length;
    return Math.round(completed/applicable.length*100);
  }
  function normalizeWorkflow(p){
    if(!p.businessLine)p.businessLine=p.part==='配件系列'?'accessories':'hydrofoil';
    if(p.phase==='cost')p.phase='graphics';
    if(!Array.isArray(p.milestones)) return;
    p.milestones=p.milestones.filter(function(m){
      return m.phase!=='cost'&&m.name!=='成本估算与利润分析'&&m.name!=='大货方案与成本最终签署'&&m.name!=='产品制造规格文档'&&m.name.indexOf('3D打印外形确认')!==0;
    });
    p.milestones.forEach(function(m){
      if(m.name==='内部产品图修改与确认'){
        m.name='内部产品图修改与确认（可选3D打印效果验证）';
        m.r='Wind / Franklin';
        m.rule='收到产品图后尽快；必要时同步3D打印查看外形效果';
      }
      if(m.name==='首样粗胚制作并寄送'){
        m.name='首样粗胚制作（寄送可选）';
        m.rule='Design Brief后2周；是否寄送根据项目需要决定';
      }
    });
    (p.variants||[]).forEach(function(v){
      if(Array.isArray(v.milestones))v.milestones=v.milestones.filter(function(m){return m.phase!=='cost'&&m.name!=='成本估算与利润分析'&&m.name!=='大货方案与成本最终签署';});
      if(v.node==='内部产品图修改与确认'){v.node='内部产品图修改与确认（可选3D打印效果验证）';v.r='Wind / Franklin';}
      if(v.node==='首样粗胚制作并寄送')v.node='首样粗胚制作（寄送可选）';
      if(!Array.isArray(v.milestones)||!v.milestones.length){
        var currentIndex=p.milestones.findIndex(function(m){var base=m.name.split('（')[0];return m.name===v.node||m.name.indexOf(v.node)>=0||v.node.indexOf(base)>=0;});
        if(currentIndex<0)currentIndex=Math.max(0,Math.min(p.milestones.length-1,Math.round((Number(v.progress)||0)/100*(p.milestones.length-1))));
        v.milestones=p.milestones.map(function(m,i){
          var item=clone(m);item.status=i<currentIndex?'已完成':i===currentIndex?v.status:'未开始';item.due=i===currentIndex?(v.due||''):'';item.actual='';item.next=i===currentIndex?(v.next||v.approval||''):'';return item;
        });
      }else{
        p.milestones.forEach(function(template){if(!v.milestones.some(function(m){return m.id===template.id;})){var item=clone(template);item.status='未开始';item.due='';item.actual='';item.next='';v.milestones.push(item);}});
      }
      if(v.node==='成本估算与利润分析'||v.node==='大货方案与成本最终签署'){
        var fallback=v.milestones.find(function(m){return m.status!=='已完成'&&m.status!=='不适用';})||v.milestones[v.milestones.length-1];
        if(fallback){v.node=fallback.name;v.status=fallback.status;v.r=fallback.r;v.a=fallback.a;v.due=fallback.due||'';v.next=fallback.next||'';v.approval=v.next||'—';}
      }
      v.progress=milestoneProgress(v.milestones);
    });

  window.updatePortfolioScroll=function(shell){

  window.bindPortfolioDrag=function(scroller){
    if(!scroller||scroller.dataset.dragBound==='1')return;scroller.dataset.dragBound='1';
    var active=false,startX=0,startLeft=0,moved=false,suppressClick=false;
    scroller.addEventListener('pointerdown',function(e){
      if(e.pointerType!=='mouse'||e.button!==0||scroller.scrollWidth<=scroller.clientWidth)return;
      active=true;moved=false;startX=e.clientX;startLeft=scroller.scrollLeft;
    });
    scroller.addEventListener('pointerleave',function(){if(!moved)active=false;});
    scroller.addEventListener('pointermove',function(e){
      if(!active)return;
      if(!(e.buttons&1)){finish(e);return;}
      var delta=e.clientX-startX;
      if(!moved&&Math.abs(delta)>4){
        moved=true;scroller.classList.add('dragging');scroller.setPointerCapture(e.pointerId);
      }
      if(moved){e.preventDefault();scroller.scrollLeft=startLeft-delta;}
    });
    function finish(e){if(!active)return;active=false;scroller.classList.remove('dragging');if(scroller.hasPointerCapture&&scroller.hasPointerCapture(e.pointerId))scroller.releasePointerCapture(e.pointerId);if(moved){suppressClick=true;setTimeout(function(){suppressClick=false;},80);}}
    scroller.addEventListener('pointerup',finish);scroller.addEventListener('pointercancel',finish);
    scroller.addEventListener('click',function(e){if(suppressClick){e.preventDefault();e.stopPropagation();}},true);
  };

  function milestoneSummary(m){
    return {node:m.name,status:m.status,r:m.r||'',a:m.a||'',due:m.due||'',next:m.next||''};

  function openMilestone(m){return m.status!=='已完成'&&m.status!=='不适用';}
  function updateVariantWorkflow(project,variant,previous,selection){
    var byId=new Map(variant.milestones.map(function(m){return [m.id,m];}));
    var ordered=project.milestones.map(function(m){return byId.get(m.id);}).filter(Boolean);
    var known=new Set(ordered);
    variant.milestones.forEach(function(m){if(!known.has(m))ordered.push(m);});
    var linked=selection&&selection.summary.node===variant.node?byId.get(selection.id):byId.get(variant.currentMilestoneId);
    if(!linked||linked.name!==variant.node){
      var matches=ordered.filter(function(m){return m.name===variant.node;});
      linked=matches.length===1?matches[0]:null;
    }
    if(linked){
      variant.currentMilestoneId=linked.id;
      var prior=previous.milestones.find(function(m){return m.id===linked.id;});
      var baseline=selection&&selection.id===linked.id?selection.summary:previous;
      if(prior){
        ['r','a','due','next'].forEach(function(key){
          if(variant[key]!==baseline[key]&&linked[key]===prior[key])linked[key]=variant[key];
        });
        if(linked.status===prior.status&&(variant.status!==baseline.status||variant.status==='已完成'))linked.status=variant.status;
      }
      if(openMilestone(linked)){
        Object.assign(variant,milestoneSummary(linked));
      }else{
        var next=ordered.slice(ordered.indexOf(linked)+1).find(openMilestone)||ordered.find(openMilestone);
        if(next){
          Object.assign(variant,milestoneSummary(next),{currentMilestoneId:next.id,approval:next.approval||'—'});
        }
      }
    }else{
      delete variant.currentMilestoneId;
      if(variant.status==='已完成'){
        var first=ordered.find(openMilestone);
        if(first)Object.assign(variant,milestoneSummary(first),{currentMilestoneId:first.id,approval:first.approval||'—'});
      }
    }
    if(ordered.length&&!ordered.some(openMilestone)){
      var completed=ordered.some(function(m){return m.status==='已完成';});
      Object.assign(variant,{node:completed?'全部里程碑已完成':'无适用里程碑',status:completed?'已完成':'不适用',due:'',next:'',approval:'—'});
      delete variant.currentMilestoneId;
    }
    variant.progress=milestoneProgress(variant.milestones);
  }

      if(!values.name){alert('请先填写产品系列名称。');return;}

      if(p.variants.some(function(v){return v.name.trim().toLowerCase()===draft.name.toLowerCase();})){alert('该尺寸 / 型号已经存在，请使用其他名称。');return;}

    }
    if(activeVariantName){
      var variant=p.variants.find(function(x){return x.name===activeVariantName;});

      document.querySelectorAll('[data-variant-mile-id]').forEach(function(el){

        if(milestone)milestone[el.dataset.variantMileKey]=el.value;
      });
      updateVariantWorkflow(p,variant,previous,selectedVariantNode);
      p.variants[variantIndex]=variant;
      p.updated=localDateString();

  function sampleGroupStatus(items){
    if(items.some(function(s){return s.status==='已延误';}))return '已延误';
    if(items.some(function(s){return s.status==='待图档'||s.status==='待排期';}))return '待处理';
    if(items.some(function(s){return s.status==='进行中';}))return '进行中';
    return '已完成';
  }
  function samplePlanHtml(){
    var filtered=sampleFiltered(),groups=Object.create(null);
    filtered.forEach(function(s){(groups[s.family]||(groups[s.family]=[])).push(s);});
    var familyCards=Object.keys(groups).map(function(family,index){
      var items=groups[family].slice().sort(function(a,b){var av=parseFloat(sampleSizeLabel(a)),bv=parseFloat(sampleSizeLabel(b));return isNaN(av)||isNaN(bv)?0:av-bv;}),done=items.filter(function(s){return s.status==='已完成';}).length;
      var groupStatus=sampleGroupStatus(items),shouldOpen=sampleFilter!=='全部'||groupStatus==='已延误'||index===0;
      var rows=items.map(function(s){
        var late=s.status==='已延误'?' late':'';
        return '<tr '+dashboardAction('openSample',[s.id])+'><td><div class="sample-size">'+esc(sampleSizeLabel(s))+'</div><div class="sample-version">'+esc(s.sample)+'</div></td>'+
          '<td>'+esc(s.qty)+'</td><td><div class="fabric">'+esc(s.fabric)+'</div></td>'+
          '<td><div class="plan-cell"><b>'+esc(s.drawing)+'</b><span>'+esc(s.owner)+'</span></div></td>'+
          '<td><div class="plan-cell"><b>'+esc(s.production)+'</b><span>'+esc(s.remarks||'—')+'</span></div></td>'+
          '<td class="sample-due'+late+'">'+esc(s.due||(s.status==='已完成'?'已完成':'待排期'))+'</td>'+
          '<td><span class="sample-badge '+sampleClass(s.status)+'">'+esc(s.status)+'</span></td>'+
          '<td><div class="bar"><i style="width:'+safePercent(s.progress)+'%"></i></div><div class="pct">'+safePercent(s.progress)+'%</div></td></tr>';
      }).join('');
      return '<details class="sample-family-group" '+(shouldOpen?'open':'')+'><summary><div class="sample-family-heading"><span class="sample-family-chevron"></span><div><h3>'+esc(family)+'</h3><p>'+items.length+' 个尺寸 / 版本</p></div></div><div class="sample-family-meta"><span>'+done+' / '+items.length+' 已完成</span><span class="sample-badge '+sampleClass(groupStatus)+'">'+esc(groupStatus)+'</span></div></summary><div class="sample-family-body"><div class="sample-table-wrap"><table class="sample-table"><thead><tr><th>尺寸 / 版本</th><th>数量</th><th>材料</th><th>图档计划</th><th>生产进展</th><th>承诺日期</th><th>状态</th><th>进度</th></tr></thead><tbody>'+rows+'</tbody></table></div></div></details>';
    }).join('');
    var filters=['全部','进行中','待处理','已延误','已完成'].map(function(f){return '<button class="sample-filter '+(sampleFilter===f?'active':'')+'" onclick="setSampleFilter(\''+f+'\')">'+f+'</button>';}).join('');
    return sampleStatsHtml()+'<section class="panel"><div class="panel-head"><div><h2>风筝厂 · '+esc(sampleFamilyFilter||'全部型号')+'</h2><p>'+(sampleFamilyFilter?'当前仅展示 '+esc(sampleFamilyFilter)+' 的不同尺寸 / 版本':'按型号分组展示不同尺寸 / 版本')+'；点击任一行查看PM录入的事实详情</p></div><div class="source-note">数据基准：2026-11-18 样品计划</div></div>'+
      '<div class="sample-controls"><div class="sample-filters">'+filters+'</div><div class="source-note">显示 '+filtered.length+' 个尺寸 / '+Object.keys(groups).length+' 个型号</div></div>'+
      '<div class="sample-groups">'+(familyCards||'<div class="sample-empty">没有符合当前筛选条件的型号</div>')+'</div></section>';
  }
  window.setSampleFilter=function(f){sampleFilter=f;render();};
  window.setSampleFamily=function(family){sampleFamilyFilter=family;sampleFilter='全部';view='samples';document.getElementById('search').value='';render();};
  window.openSample=function(id){
    activeSampleId=id;activeId=null;activeVariantName=null;
    var s=sampleState.find(function(x){return x.id===id;});if(!s)return;
    document.getElementById('drawerTitle').textContent=s.sample;
    if(READ_ONLY){
      document.getElementById('drawerSub').textContent=s.family+' · 只读事实详情 · 数据由项目负责人维护';
      document.getElementById('drawerBody').innerHTML='<div class="sample-drawer-note">来源为风筝厂 11–12 月样品计划，仅展示PM已录入内容。</div><div class="readonly-facts">'+
        '<div><span>产品系列</span><b>'+esc(s.family)+'</b></div><div><span>样品 / 尺寸 / 版本</span><b>'+esc(s.sample)+'</b></div>'+
        '<div><span>数量</span><b>'+esc(s.qty)+'</b></div><div><span>材料</span><b>'+esc(s.fabric)+'</b></div>'+
        '<div><span>状态</span><b><em class="sample-badge '+sampleClass(s.status)+'">'+esc(s.status)+'</em></b></div><div><span>承诺日期</span><b>'+esc(s.due||'待排期')+'</b></div>'+
        '<div><span>负责人</span><b>'+esc(s.owner)+'</b></div><div><span>PM录入进度</span><b>'+safePercent(s.progress)+'%</b></div>'+
        '<div class="wide"><span>图档计划 / 当前状态</span><b>'+esc(s.drawing)+'</b></div><div class="wide"><span>生产进展</span><b>'+esc(s.production)+'</b></div><div class="wide"><span>备注 / 阻塞</span><b>'+esc(s.remarks||'暂无录入')+'</b></div></div>';
    }else{
      var options=['待排期','待图档','进行中','已延误','已完成'].map(function(x){return '<option '+(x===s.status?'selected':'')+'>'+x+'</option>';}).join('');
      document.getElementById('drawerSub').textContent=s.family+' · PM维护样品图档与生产状态';
      document.getElementById('drawerBody').innerHTML='<div class="sample-drawer-note">维护内容保存到当前浏览器，不会改动原 Excel。</div><div class="sample-form">'+
        '<div class="sample-field"><label>产品系列</label><input data-sample-field="family" value="'+esc(s.family)+'"></div><div class="sample-field"><label>数量</label><input data-sample-field="qty" value="'+esc(s.qty)+'"></div>'+
        '<div class="sample-field full"><label>样品 / 尺寸 / 版本</label><input data-sample-field="sample" value="'+esc(s.sample)+'"></div><div class="sample-field full"><label>材料</label><input data-sample-field="fabric" value="'+esc(s.fabric)+'"></div>'+
        '<div class="sample-field"><label>状态</label><select data-sample-field="status">'+options+'</select></div><div class="sample-field"><label>承诺日期</label><input type="date" data-sample-field="due" value="'+esc(s.due)+'"></div>'+
        '<div class="sample-field"><label>负责人</label><input data-sample-field="owner" value="'+esc(s.owner)+'"></div><div class="sample-field"><label>进度 %</label><input type="number" min="0" max="100" data-sample-field="progress" value="'+safePercent(s.progress)+'"></div>'+
        '<div class="sample-field full"><label>图档计划 / 当前状态</label><textarea data-sample-field="drawing">'+esc(s.drawing)+'</textarea></div><div class="sample-field full"><label>生产进展</label><textarea data-sample-field="production">'+esc(s.production)+'</textarea></div><div class="sample-field full"><label>备注 / 阻塞</label><textarea data-sample-field="remarks">'+esc(s.remarks)+'</textarea></div></div>';
      var saveButton=document.querySelector('.savebar .btn.primary');if(saveButton)saveButton.textContent='保存样品更新';
    }
    reapplyLang();
    document.getElementById('mask').classList.add('show');
  };
  var originalSaveProject=window.saveProject;
  window.saveProject=function(){
    if(READ_ONLY)return;
    if(activeSampleId){
      var s=sampleState.find(function(x){return x.id===activeSampleId;});if(!s)return;
      var previous=clone(s);
      document.querySelectorAll('[data-sample-field]').forEach(function(el){var k=el.dataset.sampleField,v=el.value;if(k==='progress')v=Math.max(0,Math.min(100,Number(v)||0));s[k]=v;});
      if(!saveSamples()){Object.assign(s,previous);return;}closeDrawer();render();return;
    }
    originalSaveProject();
  };
  var originalCloseDrawer=window.closeDrawer;
  window.closeDrawer=function(){activeSampleId=null;originalCloseDrawer();};
  window.resetDemo=function(){if(READ_ONLY)return;alert(window.DASHBOARD_LANG==='en'?'Demo reset is disabled to protect saved project data.':'为保护已维护的数据，已停用演示重置。');};
  var originalExportData=window.exportData;
  window.exportData=function(){
    if(view!=='samples'){originalExportData();return;}
    var b=new Blob([JSON.stringify(sampleState,null,2)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='风筝厂11-12月样品计划备份.json';a.click();URL.revokeObjectURL(a.href);
  };
  var reviewExport=document.getElementById('reviewSnapshotExport');
  if(reviewExport&&!READ_ONLY){
    reviewExport.hidden=false;
    reviewExport.addEventListener('click',function(){
      if(unreadableRecords.size){
        alert(window.DASHBOARD_LANG==='en'?'Some saved records could not be read. Review data was not exported.':'有本地记录无法读取，本次未导出评审数据。');
        return;
      }
      var snapshot={version:1,exportedAt:new Date().toISOString(),projects:seriesState,wingSamples:sampleState};
      var file=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'});
      var link=document.createElement('a');
      var url=URL.createObjectURL(file);
      link.href=url;link.download='Armstrong-看板评审数据-'+localDateString()+'.json';
      link.click();
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
    });
  }
  function reapplyLang(){if(window.applyDashboardLanguage)window.applyDashboardLanguage(document);}
  window.setView=function(v){view=v;dashboardFilter='all';gateApproverFilter='';gateSeriesFilter='';document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.dataset.view===v);});document.getElementById('search').value='';render();};
  window.renderDashboardResults=function(){document.getElementById('main').innerHTML=view==='samples'?samplePlanHtml():view==='matrix'?matrixHtml():overviewHtml();reapplyLang();};
  window.render=function(){renderSidebarProjects();var focusEl=document.getElementById('executiveFocus');if(view==='samples'){document.getElementById('stats').style.display='none';if(focusEl)focusEl.style.display='none';document.getElementById('main').innerHTML=samplePlanHtml();reapplyLang();return;}document.getElementById('stats').style.display='grid';if(focusEl)focusEl.style.display='grid';renderStats();renderExecutiveFocus();document.getElementById('main').innerHTML=view==='matrix'?matrixHtml():overviewHtml();reapplyLang();};
  document.getElementById('search').value=readDashboardPreference('foil_dashboard_search')||'';
  render();
  var query=new URLSearchParams(location.search);
  var requestedView=query.get('view');
  var requestedSample=query.get('sample');
  var requested=query.get('open');
  var requestedVariant=query.get('variant');
  var requestedNew=query.get('new');
  if(requestedNew==='1'&&!READ_ONLY)openNewProject();
  else if(requestedView==='samples'){setView('samples');if(requestedSample)openSample(requestedSample);}
  else if(requested&&requestedVariant) openVariant(requested,requestedVariant);
  else if(requested) openProject(requested);
})();

</script>
