<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armstrong · 新品开发进度</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#f3f5f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eef2f5,#f8f9fa)}
.login{width:min(420px,calc(100vw - 32px));background:#fff;border:1px solid #dde2e8;border-radius:18px;padding:32px;box-shadow:0 18px 55px rgba(21,32,51,.1)}
.brand{font-size:12px;font-weight:800;letter-spacing:.14em;color:#0057b8}.login h1{font-size:27px;margin:9px 0 5px}.hint{color:#65728a;font-size:13px;margin:0 0 24px}
label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input{width:100%;height:46px;border:1px solid #d4dbe4;border-radius:10px;padding:0 13px;font:inherit;outline:none}input:focus{border-color:#0057b8;box-shadow:0 0 0 3px rgba(0,87,184,.12)}
button{width:100%;height:46px;margin-top:20px;border:0;border-radius:10px;background:#172033;color:#fff;font:700 14px inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{min-height:20px;margin-top:12px;color:#c92a2a;font-size:12px}.loading{display:none;text-align:center;color:#65728a}.loading.show{display:block}.login.loading-state form{display:none}
.resume-state .login{display:none}.resume-state body:before{content:"";position:fixed;z-index:99;top:0;left:0;width:34%;height:3px;border-radius:0 999px 999px 0;background:#0755c9;box-shadow:0 0 12px rgba(7,85,201,.32);animation:resumeProgress 1.15s ease-in-out infinite alternate}@keyframes resumeProgress{from{transform:translateX(-70%);opacity:.5}to{transform:translateX(285%);opacity:1}}@media(prefers-reduced-motion:reduce){.resume-state body:before{animation:none;width:100%;opacity:.55}}
</style>
</head>
<body>
<main class="login" id="loginPanel">
  <div class="brand">ARMSTRONG</div>
  <h1>项目看板</h1>
  <p class="hint">登录后读取腾讯云共享数据<br>Sign in to load the shared workspace.</p>
  <form id="loginForm">
    <label for="username">账号 Account</label><input id="username" name="username" autocomplete="username" required>
    <label for="password">密码 Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="loginButton" type="submit">登录 / Sign in</button>
    <div class="error" id="loginError" role="alert"></div>
  </form>
  <div class="loading" id="loading">正在载入共享看板…<br>Loading shared dashboard…</div>
</main>
<script>
(function(){
  'use strict';
  var API_BASE='https://collectables-theme-providence-eyes.trycloudflare.com';
  var TOKEN_KEY='armstrong_shared_session_v1';
  var panel=document.getElementById('loginPanel'),form=document.getElementById('loginForm'),button=document.getElementById('loginButton'),error=document.getElementById('loginError'),loading=document.getElementById('loading');
  function token(){try{return sessionStorage.getItem(TOKEN_KEY)||'';}catch(e){return '';}}
  function remember(value){try{if(value)sessionStorage.setItem(TOKEN_KEY,value);else sessionStorage.removeItem(TOKEN_KEY);}catch(e){}}
  function message(text){error.textContent=text||'';}
  function busy(active){button.disabled=active;panel.classList.toggle('loading-state',active);loading.classList.toggle('show',active);}
  async function openDashboard(data,sessionToken){
    var response=await fetch('./app.html?v=20261123-mobile-v2',{cache:'no-store'});
    if(!response.ok)throw Error('app');
    var source=await response.text();
    var bootstrap=JSON.stringify(data).replace(/</g,'\\u003c');
    source=source.replace('<!--ARMSTRONG_BOOTSTRAP-->',bootstrap)
      .replace('<!--ARMSTRONG_GITHUB_CONFIG-->','window.ARMSTRONG_API_BASE='+JSON.stringify(API_BASE)+';window.ARMSTRONG_SESSION_TOKEN='+JSON.stringify(sessionToken)+';window.ARMSTRONG_SESSION_KEY='+JSON.stringify(TOKEN_KEY)+';');
    document.open();document.write(source);document.close();
  }
  async function resume(){
    var sessionToken=token();if(!sessionToken)return;
    document.documentElement.classList.add('resume-state');
    try{
      var response=await fetch(API_BASE+'/api/bootstrap',{headers:{Authorization:'Bearer '+sessionToken},cache:'no-store',signal:AbortSignal.timeout(15000)});
      if(response.status===401||response.status===403){remember('');document.documentElement.classList.remove('resume-state');return;}
      if(!response.ok)throw Error('bootstrap');
      await openDashboard(await response.json(),sessionToken);
    }catch(e){document.documentElement.classList.remove('resume-state');busy(false);message('暂时无法连接共享服务器，请稍后重试。 Unable to reach the shared server.');}
  }
  form.addEventListener('submit',async function(event){
    event.preventDefault();message('');button.disabled=true;
    try{
      var response=await fetch(API_BASE+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value}),signal:AbortSignal.timeout(15000)});
      if(response.status===401){message('账号或密码不正确。 Invalid account or password.');button.disabled=false;return;}
      if(response.status===429){message('尝试次数过多，请稍后再试。 Too many attempts.');button.disabled=false;return;}
      if(!response.ok)throw Error('login');
      var data=await response.json();remember(data.token);busy(true);await openDashboard(data,data.token);
    }catch(e){busy(false);button.disabled=false;message('登录服务暂时不可用，请稍后重试。 Sign-in service is unavailable.');}
  });
  resume();
})();
</script>
</body>
</html>
