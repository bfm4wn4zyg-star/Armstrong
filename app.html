body,button,input,select,textarea{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}

  content:"";position:absolute;inset:0 0 0 auto;width:min(100%,1280px);z-index:0;

  mask-image:linear-gradient(90deg,transparent,#000 48%);pointer-events:none
}

  background:linear-gradient(90deg,rgba(3,15,30,.32),transparent 66%),linear-gradient(180deg,rgba(3,15,30,.26),transparent 33%,transparent 65%,rgba(3,15,30,.23))
}

/* One surface, inset and type scale for the workspace and its tables. */
.dashboard5-theme {
  --workspace-inset:clamp(14px,1.6vw,22px);
  --workspace-radius:16px;
  --workspace-gap:16px;
  --workspace-active:#294f67;
  --workspace-control:#f9faf8;
}
.dashboard5-theme .workspace-toolbar,
.dashboard5-theme #main>.workspace-section {
  min-width:0;overflow:hidden;
  border:1px solid var(--reading-line);border-radius:var(--workspace-radius);
  background:var(--reading-surface);box-shadow:var(--dashboard-elevation);
}
.dashboard5-theme #main {display:grid;gap:var(--workspace-gap);min-width:0}
.dashboard5-theme #main>.workspace-section {margin:0}
.dashboard5-theme .workspace-toolbar {margin:0 0 var(--workspace-gap)}
.dashboard5-theme .workspace-toolbar .tabs {
  justify-self:stretch;gap:clamp(12px,2vw,26px);padding:0 var(--workspace-inset);
  border:0;border-radius:0;background:var(--reading-surface);
}
.dashboard5-theme .workspace-toolbar .tab {
  position:relative;padding:12px 1px 11px;background:transparent;
  border:0;border-bottom:2px solid transparent;border-radius:0;
  color:var(--reading-muted);font-weight:550;letter-spacing:normal;
}
.dashboard5-theme .workspace-toolbar .tab:hover {color:var(--workspace-active)}
.dashboard5-theme .workspace-toolbar .tab.active {
  color:var(--workspace-active);background:transparent;
  border-bottom-color:var(--workspace-active);font-weight:650;
}
.dashboard5-theme .workspace-filters {
  display:grid;grid-template-columns:minmax(145px,.8fr) minmax(0,2.4fr);
  align-items:end;gap:10px;padding:12px var(--workspace-inset) 14px;
  background:var(--reading-raised);border-top:1px solid var(--reading-line);

.dashboard5-theme .workspace-filters:has(>.priority-controls[hidden]) {grid-template-columns:minmax(0,360px)}
.dashboard5-theme .workspace-filters .priority-controls {

.workspace-filter-field {display:grid;gap:5px;min-width:0}
.dashboard5-theme .workspace-filter-field label {font-weight:600;font-size:13px;line-height:1.35}
.dashboard5-theme .workspace-filters :is(select,.search,.workspace-reset) {

.dashboard5-theme .workspace-filters :is(select,.search,.workspace-reset):focus-visible,

}
.dashboard5-theme .workspace-filters .workspace-reset {color:var(--workspace-active);justify-self:start}
.dashboard5-theme .workspace-filters .workspace-reset:hover {background:#e6edef}
.dashboard5-theme #main .workspace-section-head {
  display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px 16px;
  flex-wrap:wrap;padding:15px var(--workspace-inset);
  background:var(--reading-surface);border:0;border-bottom:1px solid var(--reading-line);

/* Review dashboard appearance, with the current local workflow. */
.dashboard5-theme {
  --reading-canvas:#f2f5f8;--reading-surface:#fff;--reading-raised:#f4f7fa;
  --reading-line:#dbe3ed;--reading-ink:#172033;--reading-muted:#47576b;
  --reading-accent:#0755c9;--workspace-active:#0755c9;--workspace-control:#fff;
  --dashboard-elevation:0 5px 20px rgba(29,49,79,.055);
}
.dashboard5-theme .app {max-width:1600px;padding-block:24px 44px}
.dashboard5-theme .sidebar-link.active {background:#eaf2ff;color:#0755c9;box-shadow:inset 3px 0 #0755c9}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero {
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;
  gap:0;isolation:isolate;overflow:hidden;position:relative;
  min-height:248px;margin:0 0 20px;padding:0;border:0;border-radius:18px;
  background:#0a192a;box-shadow:0 12px 32px rgba(25,49,76,.12);
}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero::before {
  display:block;width:min(100%,1280px);background-position:50% 57%;
  mask-image:linear-gradient(90deg,transparent,#000 49%);
  animation:none;
}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero::after {
  display:block;inset:0;width:auto;height:auto;transform:none;z-index:0;
  background:linear-gradient(90deg,rgba(4,16,31,.56),rgba(5,20,36,.15) 54%,transparent 77%);
}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .header {
  grid-area:2/1;z-index:1;display:flex;align-items:flex-end;
  min-height:0;padding:12px clamp(20px,2.6vw,38px) 32px;
}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .header>div:first-child {max-width:min(51%,680px)}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .header h1 {
  margin:6px 0 0;color:#fff;font-size:clamp(28px,2.5vw,40px);
  line-height:1.18;letter-spacing:normal;text-wrap:pretty;
}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .header .eyebrow {
  color:#e7edf4;font-size:13px;font-weight:600;letter-spacing:.045em;
}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .dashboard-utility {
  grid-area:1/1;z-index:2;padding:14px 15px 0;
}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .dashboard-utility .actions {justify-content:flex-end;flex-wrap:wrap}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .dashboard-utility .btn {

.dashboard5-theme:not(.presentation-mode) .dashboard-hero .language-switch {background:#172b3ee8;border-color:#718193}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .language-switch button {color:#e2eaf5}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .language-switch button.active {color:#0755c9;background:#fff}
.dashboard5-theme:not(.presentation-mode) .dashboard-hero .local-role {color:#f1f5fa}

  .dashboard5-theme:not(.presentation-mode) .dashboard-hero {min-height:214px;border-radius:14px}

/* D6 review: neutral surfaces, a common card radius and compact hero. */
.dashboard5-theme.d6-style {
  --reading-canvas:#f4f5f6;--reading-surface:#fff;--reading-raised:#f6f7f8;
  --reading-line:#dfe3e7;--reading-ink:#20262d;--reading-muted:#4c5865;
  --reading-accent:#283b50;--workspace-active:#283b50;--workspace-control:#fff;
  --workspace-radius:18px;--dashboard-elevation:0 4px 16px rgba(33,45,59,.045);
}

.dashboard5-theme.d6-style:not(.presentation-mode) .dashboard-hero {
  min-height:149px;overflow:hidden;border:1px solid var(--reading-line);background:#fff;border-radius:18px;
  box-shadow:var(--dashboard-elevation);
}
.dashboard5-theme.d6-style:not(.presentation-mode) .dashboard-hero::before {
  inset:0 0 0 auto;width:34%;background-position:50% 60%;
  mask-image:linear-gradient(90deg,transparent,#000 24%);
  filter:saturate(.68);opacity:.36;
}
.dashboard5-theme.d6-style:not(.presentation-mode) .dashboard-hero::after {display:none}

  window.dashboardText=function(text){return lang==='en'?translateText(String(text??'')):text;};
  function translateText(text){
    var lead=(text.match(/^\s*/)||[''])[0],trail=(text.match(/\s*$/)||[''])[0],core=text.trim();
    if(Object.prototype.hasOwnProperty.call(en,core))return lead+en[core]+trail;
    var m=core.match(/^(\d+) 个尺寸 \/ 版本$/);if(m)return lead+m[1]+' sizes / versions'+trail;
    m=core.match(/^(\d+) \/ (\d+) 已完成$/);if(m)return lead+m[1]+' / '+m[2]+' completed'+trail;
    m=core.match(/^显示 (\d+) 个尺寸 \/ (\d+) 个型号$/);if(m)return lead+'Showing '+m[1]+' sizes / '+m[2]+' models'+trail;
    m=core.match(/^(\d+)项待确认$/);if(m)return lead+m[1]+' pending'+trail;
    m=core.match(/^(\d+)天$/);if(m)return lead+m[1]+' days'+trail;
    m=core.match(/^超期(\d+)天$/);if(m)return lead+m[1]+' days overdue'+trail;
    m=core.match(/^超期\s*(\d+)\s*天$/);if(m)return lead+m[1]+' days overdue'+trail;
    m=core.match(/^等待 (.+) 确认$/);if(m)return lead+'Awaiting confirmation from '+m[1]+trail;
    m=core.match(/^(等待确认|当前负责人)：(.+)$/);if(m)return lead+(m[1]==='等待确认'?'Awaiting Confirmation':'Current Owner')+': '+m[2]+trail;
    m=core.match(/^Armie 待处理 (\d+) 项$/);if(m)return lead+'Armie · '+m[1]+' pending items'+trail;
    m=core.match(/^(\d+)个产品系列正在推进，(\d+)项等待确认，(\d+)项延误或阻塞$/);if(m)return lead+m[1]+' active product series, '+m[2]+' pending confirmations, '+m[3]+' delayed or blocked'+trail;
    m=core.match(/^风筝厂 · (.+)$/);if(m)return lead+'Kite Factory · '+translateText(m[1])+trail;
    m=core.match(/^当前仅展示 (.+) 的不同尺寸 \/ 版本；点击任一行查看PM录入的事实详情$/);if(m)return lead+'Showing only '+m[1]+' sizes / versions. Click a row to view the PM-recorded details.'+trail;
    m=core.match(/^按型号分组展示不同尺寸 \/ 版本；点击任一行查看PM录入的事实详情$/);if(m)return lead+'Grouped by model with size / version details. Click a row to view the PM-recorded details.'+trail;
    m=core.match(/^(.+) · (\d+)个尺寸\/型号 · (只读|PM维护) · 更新 (.+)$/);if(m)return lead+translateText(m[1])+' · '+m[2]+' sizes / models · '+(m[3]==='只读'?'Read-only':'PM maintained')+' · Updated '+m[4]+trail;
    m=core.match(/^(.+) · (\d+)个尺寸\/型号 · 项目跟进人 (.+)$/);if(m)return lead+translateText(m[1])+' · '+m[2]+' sizes / models · Project owner '+m[3]+trail;
    m=core.match(/^(.+) · (\d+)个尺寸\/型号 · (.+)$/);if(m)return lead+translateText(m[1])+' · '+m[2]+' sizes / models · '+m[3]+trail;
    m=core.match(/^(.+) · (\d+)个尺寸\/型号$/);if(m)return lead+translateText(m[1])+' · '+m[2]+' sizes / models'+trail;
    m=core.match(/^已等待：(\d+)天$/);if(m)return lead+'Waiting: '+m[1]+' days'+trail;
    m=core.match(/^提交：(.+)$/);if(m)return lead+'Submitted: '+m[1]+trail;
    m=core.match(/^确认：(.+) · 需要 (.+)$/);if(m)return lead+'Approver: '+m[1]+' · Needed by '+m[2]+trail;
    m=core.match(/^确认：(.+)$/);if(m)return lead+'Approver: '+m[1]+trail;
    m=core.match(/^影响：$/);if(m)return lead+'Impact:'+trail;
    m=core.match(/^影响：(.+)$/);if(m)return lead+'Impact: '+m[1]+trail;
    m=core.match(/^状态：(.+)$/);if(m){var st=translateText(m[1]);return lead+'Status: '+st+trail;}
    m=core.match(/^(\d+)个节点$/);if(m)return lead+m[1]+' milestones'+trail;
    m=core.match(/^(.+) 的独立执行里程碑$/);if(m)return lead+m[1]+' Independent Milestones'+trail;
    m=core.match(/^(.+) · (.+) · 更新 (.+)$/);if(m)return lead+translateText(m[1])+' · '+translateText(m[2])+' · Updated '+m[3]+trail;
    m=core.match(/^更新 (.+)$/);if(m)return lead+'Updated '+m[1]+trail;
    m=core.match(/^查看 (.+) 的事实详情$/);if(m)return lead+'View details for '+m[1]+trail;
    m=core.match(/^重命名 (.+)$/);if(m)return lead+'Rename '+m[1]+trail;
    m=core.match(/^删除 (.+)$/);if(m)return lead+'Delete '+m[1]+trail;
    m=core.match(/^在(.+)新增项目$/);if(m)return lead+'Add project to '+translateText(m[1])+trail;
    m=core.match(/^返回 (.+)$/);if(m)return lead+'Back to '+m[1]+trail;
    m=core.match(/^(.+) 进展编辑$/);if(m)return lead+'Edit progress for '+m[1]+trail;
    m=core.match(/^(\d+)个尺寸\/型号$/);if(m)return lead+m[1]+' sizes / models'+trail;
    m=core.match(/^项目跟进人 (.+)$/);if(m)return lead+'Project owner '+m[1]+trail;
    m=core.match(/^([^（]+)（([^）]+)）：(.+)$/);
    if(m){
      var questions={
        '是否批准当前铺层方案？':'Approve the current layup plan?',
        '是否接受次品率超标的现有数据？':'Accept the current data despite the out-of-limit defect rate?',
        '最终材料采用哪一方案？':'Which material option should we use?',
        '请确认当前方案':'Please confirm the current plan.'
      };
      if(questions[m[3]])return lead+translateText(m[1])+' ('+m[2]+'): '+questions[m[3]]+trail;
    }
    var parts=core.split(' · ');
    if(parts.length>1)return lead+parts.map(translateText).join(' · ')+trail;
    return text;
  }

    if(lang==='en'){
      root.querySelectorAll('[title],[aria-label],[placeholder]').forEach(function(el){
        ['title','aria-label','placeholder'].forEach(function(attr){
          var value=el.getAttribute(attr);
          if(value){var next=translateText(value);if(next!==value)el.setAttribute(attr,next);}
        });
      });
    }
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    if(lang==='en')nodes.forEach(function(n){if(n.parentElement?.closest('script,style,textarea'))return;var v=translateText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;});
    document.querySelectorAll('.language-switch button').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang);});
  };
  window.setDashboardLanguage=function(next){writeDashboardPreference('foil_dashboard_language',next);var u=new URL(location.href);u.searchParams.delete('lang');location.href=u.href;};
  document.addEventListener('DOMContentLoaded',function(){
    window.applyDashboardLanguage(document);
    var pending=false;new MutationObserver(function(){if(pending)return;pending=true;requestAnimationFrame(function(){pending=false;window.applyDashboardLanguage(document);});}).observe(document.body,{childList:true,subtree:true});
  });
})();
</script>

<script>

['graphics','产品包结构样确认','Chris D','Irri','Armie','Nathan / Ulrica','Nathan','3D打印样后7–10天'],

];
function makeMilestones(done,current,late){return TEMPLATE.map((x,i)=>({id:'m'+(i+1),phase:x[0],name:x[1],r:x[2],a:x[3],c:x[4],inf:x[5],sign:x[6],rule:x[7],status:i<done?'已完成':i===current?(late?'已延误':'进行中'):'未开始',due:i===current?(late?'2026-11-07':'2026-11-25'):'',actual:i<done?'2026-10-'+String(Math.min(28,5+i)).padStart(2,'0'):'',next:i===current?'确认交付物并取得最终签署':''}))}
const SEED=[
 {id:'gp',name:'Glide Performance GP 85/105/125',part:'前翼',priority:'最高',owner:'Ulrica',phase:'structure',health:'已延误',updated:'2026-11-03',milestones:makeMilestones(3,3,true),samples:[['GP 85 / RT85-8','粗胚','3','开模中','2026-11-07'],['GP 105 / RT105-8','粗胚','3','铺层进行中','2026-11-21'],['GP 125 / RT125-8','粗胚','3','铺层进行中','2026-11-21']]},
 {id:'p14588',name:'P14 588 (DWP MKII 588-1.0)',part:'前翼',priority:'高',owner:'Teo',phase:'structure',health:'进行中',updated:'2026-11-18',milestones:makeMilestones(7,7,false),samples:[['P14 588','粗胚','3','制作中','2026-11-25']]},
 {id:'p14738',name:'P14 738 (DWP MKII 738-1.0)',part:'前翼',priority:'高',owner:'Teo',phase:'structure',health:'阻塞',updated:'2026-11-17',milestones:makeMilestones(8,9,false),samples:[['P14 738','测试样','2','待确认测试参数','2026-11-22']]},
 {id:'tail105',name:'DWPTail 105-8 (RT 105-7)',part:'尾翼',priority:'中',owner:'Rita',phase:'concept',health:'进行中',updated:'2026-11-19',milestones:makeMilestones(0,0,false),samples:[]},
 {id:'fd',name:'FD 电缆套装',part:'配件',priority:'中',owner:'Rita',phase:'structure',health:'待签署',updated:'2026-11-18',milestones:makeMilestones(15,15,false),samples:[['FD 电缆套装','产前样','5','待签署','2026-11-21']]},
 {id:'ha680',name:'HA MKIII 680',part:'前翼',priority:'中',owner:'Armie',phase:'graphics',health:'进行中',updated:'2026-11-16',milestones:makeMilestones(23,23,false),samples:[['HA MKIII 680','成品样','3','待水标图档','2026-11-30']]}
];
let state=load(),view='overview',activeId=null;
function load(){try{let x=JSON.parse(localStorage.getItem(STORE));if(Array.isArray(x))return x}catch(e){}return structuredClone(SEED)}
function persist(){localStorage.setItem(STORE,JSON.stringify(state))}
function resetDemo(){state=structuredClone(SEED);persist();render()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return String(n).split(/[ /,]/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'—'}
function cls(s){return s==='已完成'?'done':s==='进行中'?'doing':s==='已延误'?'late':s==='阻塞'?'blocked':s==='待签署'?'waiting':'todo'}
function cur(p){return p.milestones.find(m=>!['已完成','不适用'].includes(m.status))||p.milestones.at(-1)}
function progress(p){return Math.round(p.milestones.filter(m=>m.status==='已完成').length/p.milestones.length*100)}
function phaseName(id){return PHASES.find(x=>x.id===id)?.name||id}
function filtered(){let q=document.getElementById('search')?.value.trim().toLowerCase()||'';if(!q)return state;return state.filter(p=>{let m=cur(p);return [p.name,p.owner,m.name,m.r,m.a,m.sign].join(' ').toLowerCase().includes(q)})}
function setView(v){view=v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}
function render(){renderStats();document.getElementById('main').innerHTML=view==='matrix'?matrixHtml():overviewHtml()}
function renderStats(){let delayed=state.filter(p=>['已延误','阻塞'].includes(p.health)).length;let sign=state.filter(p=>p.health==='待签署').length;let active=state.filter(p=>progress(p)<100).length;let due=state.flatMap(p=>p.milestones).filter(m=>m.due>='2026-11-20'&&m.due<='2026-11-27'&&m.status!=='已完成').length;let d=[[state.length,'项目总数',''],[active,'进行中项目',''],[delayed,'延误或阻塞','danger'],[sign,'等待最终签署','warn'],[due,'7天内到期','ok']];document.getElementById('stats').innerHTML=d.map(x=>`<div class="stat ${x[2]}"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('')}
function overviewHtml(){let ps=filtered();return `<section class="panel"><div class="panel-head"><div><h2>项目状态总览</h2><p>只显示当前需要推动的里程碑，点击项目查看完整 RACI 与打样任务</p></div><div class="legend"><span><i class="dot red"></i>延误/阻塞</span><span><i class="dot amber"></i>待签署</span><span><i class="dot green"></i>正常推进</span></div></div><table><thead><tr><th>项目 / 型号</th><th>当前阶段</th><th>当前关键里程碑</th><th>执行人 R</th><th>负责人 A</th><th>下一截止日</th><th>最终签署</th><th>状态</th><th>整体进度</th></tr></thead><tbody>${ps.map(p=>{let m=cur(p),pc=progress(p);return `<tr onclick="openProject('${p.id}')"><td><div class="project">${esc(p.name)}</div><div class="meta">${p.part} · ${p.priority}优先级 · 更新 ${p.updated}</div></td><td><span class="phase">${phaseName(m.phase)}</span></td><td><b>${esc(m.name)}</b><div class="meta">${esc(m.next||m.rule)}</div></td><td><div class="person"><i class="avatar">${initials(m.r)}</i>${esc(m.r)}</div></td><td>${esc(m.a)}</td><td>${m.due||'依前置节点'}</td><td>${esc(m.sign)}</td><td><span class="status ${cls(p.health)}">${p.health}</span></td><td><div class="bar"><i style="width:${pc}%"></i></div><div class="pct">${pc}% · ${p.milestones.filter(x=>x.status==='已完成').length}/${p.milestones.length}</div></td></tr>`}).join('')}</tbody></table></section><section style="margin-top:15px"><div class="exceptions"><div class="ex"><h3>需要立即处理</h3>${state.filter(p=>['已延误','阻塞'].includes(p.health)).map(p=>`<div class="ex-item"><div class="ex-title">${p.name}</div><div class="ex-note">${cur(p).name} · ${cur(p).a}</div></div>`).join('')||'<div class="tiny">暂无</div>'}</div><div class="ex"><h3>等待最终签署</h3>${state.filter(p=>p.health==='待签署').map(p=>`<div class="ex-item"><div class="ex-title">${p.name}</div><div class="ex-note">签署人：${cur(p).sign}</div></div>`).join('')||'<div class="tiny">暂无</div>'}</div><div class="ex"><h3>本周样品节点</h3>${state.flatMap(p=>p.samples.map(s=>({p:p.name,s}))).filter(x=>x.s[4]<='2026-11-27').slice(0,4).map(x=>`<div class="ex-item"><div class="ex-title">${x.s[0]} · ${x.s[1]}</div><div class="ex-note">${x.s[3]} · ${x.s[4]}</div></div>`).join('')}</div></div></section>`}
function matrixHtml(){let p=filtered()[0]||state[0];return `<section class="panel"><div class="panel-head"><div><h2>${esc(p.name)} · 里程碑矩阵</h2><p>R 执行、A 唯一责任、C 咨询、I 告知、Final Sign Off 最终签署</p></div><button class="btn" onclick="openProject('${p.id}')">打开项目详情</button></div><div class="matrix"><table><thead><tr><th>阶段</th><th>关键里程碑</th><th>R</th><th>A</th><th>C</th><th>I</th><th>最终签署</th><th>时间规则</th><th>状态</th></tr></thead><tbody>${PHASES.map(ph=>`<tr class="phase-row"><td colspan="9">${ph.name}</td></tr>${p.milestones.filter(m=>m.phase===ph.id).map(m=>`<tr><td></td><td class="mile"><b>${esc(m.name)}</b>${m.a.includes('/')&&m.name.includes('工装')?'<div class="warning">注意：此节点存在两个 Accountable，建议确认唯一负责人</div>':''}</td><td>${esc(m.r)}</td><td>${esc(m.a)}</td><td>${esc(m.c)}</td><td>${esc(m.inf)}</td><td>${esc(m.sign)}</td><td class="tiny">${esc(m.rule)}</td><td><span class="status ${cls(m.status)}">${m.status}</span></td></tr>`).join('')}`).join('')}</tbody></table></div></section>`}

  function clone(x){return JSON.parse(JSON.stringify(x));}
  function loadRecords(key){return clone(TEAM.state[teamBucket(key)].records);}
  function teamBucket(key){return key===SERIES_STORE?'series':'samples';}
  function loadSeries(){
    function validMilestone(m){return m&&typeof m.name==='string';}
    return loadRecords(SERIES_STORE,SERIES_SEED,function(p){
      return p&&typeof p.name==='string'&&typeof p.id==='string'
        &&Array.isArray(p.variants)&&p.variants.every(function(v){return v&&typeof v.name==='string'&&typeof v.node==='string'&&(!Array.isArray(v.milestones)||v.milestones.every(validMilestone));})
        &&Array.isArray(p.approvals)&&p.approvals.every(function(a){return a&&typeof a==='object';})
        &&Array.isArray(p.milestones)&&p.milestones.every(validMilestone)
        &&Array.isArray(p.samples)&&p.samples.every(Array.isArray);
    });
  }
  function localDateString(){
    return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  }
  function calendarDay(value){
    var match=/^(\d{4})([-/])(\d{2})\2(\d{2})$/.exec(String(value||''));
    if(!match)return null;
    var date=match[1]+'-'+match[3]+'-'+match[4],time=Date.parse(date+'T00:00:00Z');
    return Number.isFinite(time)&&new Date(time).toISOString().slice(0,10)===date?time/86400000:null;
  }
  function dayDiff(from,to){
    var start=calendarDay(from),end=calendarDay(to);
    return start===null||end===null?null:Math.max(0,end-start);
  }
  function waitingDays(a){return a.status==='待确认'?dayDiff(a.submitted,localDateString()):null;}
  function overdueDays(a){return a.status==='待确认'?dayDiff(a.needed,localDateString()):null;}
  function waitingLabel(days){return days===null?'—':days+'天';}
  function confirmationTitle(a){
    if(a.question) return a.question;
    if(a.kind==='测试异常处理') return '测试异常处理（'+a.scope+'）：是否接受次品率超标的现有数据？';
    if(a.kind==='铺层确认') return '铺层确认（'+a.scope+'）：是否批准当前铺层方案？';
    if(a.kind==='材料确认') return '材料确认（'+a.scope+'）：最终材料采用哪一方案？';
    return a.kind+'（'+a.scope+'）：请确认当前方案';
  }
  function milestoneProgress(items){
    var applicable=(items||[]).filter(function(m){return m.status!=='不适用';});
    if(!applicable.length)return 0;
    var completed=applicable.filter(function(m){return m.status==='已完成';}).length;
    return Math.round(completed/applicable.length*100);
  }
  var retiredLayup='首样铺层结构确认';
  var legacyTest='测试方法、参数与样品测试';
  var legacyFeedback='设计团队反馈铺层、重量与强度';
  var combinedTest='测试方法、参数、样品测试与结果反馈';
  var combinedTestRule='样品完成后开展测试；测试后2个工作日内由设计团队反馈铺层、重量与强度';

  function isLegacyTestName(name){return name===legacyTest||name==='测试方法与样品测试';}
  function latestMilestoneDate(first,second){
    return [first,second].filter(function(date){return calendarDay(date)!==null;})
      .sort(function(a,b){return calendarDay(b)-calendarDay(a);})[0]||first||second||'';
  }
  function mergeTestingSteps(test,feedback){
    var stages=[test,feedback].filter(Boolean);
    var statuses=stages.map(function(m){return m.status;});
    var priority=['阻塞','已延误','待确认','待签署','暂停','进行中'];
    var status=priority.find(function(value){return statuses.includes(value);});
    if(!status){
      var applicable=statuses.filter(function(value){return value!=='不适用';});
      status=!applicable.length?'不适用':
        applicable.every(function(value){return value==='已完成';})?'已完成':
        applicable.includes('已完成')?'进行中':applicable[0]||'未开始';
    }
    var lead=feedback&&openMilestone(feedback)&&(!test||!openMilestone(test))?feedback:stages[0];
    return Object.assign({},test||feedback,{
      name:combinedTest,rule:combinedTestRule,status:status,r:lead.r,a:lead.a,
      due:latestMilestoneDate(test&&test.due,feedback&&feedback.due),
      actual:status==='已完成'?latestMilestoneDate(test&&test.actual,feedback&&feedback.actual):'',
      next:Array.from(new Set(stages.map(function(m){return m.next;}).filter(Boolean))).join('；')
    });
  }
  function migrateTestingWorkflow(record){
    var items=record.milestones;
    var layup=items.find(function(m){return m.name===retiredLayup;});
    var test=items.find(function(m){return isLegacyTestName(m.name);});
    var feedback=items.find(function(m){return m.name===legacyFeedback;});
    if(!layup&&!test&&!feedback)return;
    var archived=[layup,test,feedback].filter(Boolean);
    record.retiredMilestones=(record.retiredMilestones||[]).concat(archived);
    var anchor=test||feedback;
    var merged=anchor&&mergeTestingSteps(test,feedback);
    var currentChanged=archived.some(function(m){return m.id===record.currentMilestoneId;});
    var following=layup?items.slice(items.indexOf(layup)+1):[];
    record.milestones=items.flatMap(function(m){
      return m===anchor?[merged]:archived.includes(m)?[]:[m];
    });
    if(record.node===retiredLayup||(layup&&record.currentMilestoneId===layup.id)){
      var next=record.milestones.find(function(m){return openMilestone(m)&&(following.includes(m)||m===merged&&following.includes(anchor));})
        ||record.milestones.find(openMilestone);
      if(next)Object.assign(record,milestoneSummary(next),{currentMilestoneId:next.id,approval:next.approval||'—'});
      else updateVariantWorkflow(record,record,clone(record));
    }else if(merged&&(currentChanged||isLegacyTestName(record.node)||record.node===legacyFeedback)){
      Object.assign(record,milestoneSummary(merged),{currentMilestoneId:merged.id});
    }
  }
  function normalizeWorkflow(p){
    if(!p.releaseDate)p.releaseDate='';
    if(!PRIORITIES.includes(p.priority))p.priority='中';

      return m.phase!=='cost'&&m.name!=='成本估算与利润分析'&&m.name!=='大货方案与成本最终签署'&&m.name!=='产品制造规格文档'&&m.name.indexOf('3D打印外形确认')!==0;
    });
    p.milestones.forEach(function(m){
      if(m.name==='内部产品图修改与确认'){
        m.name='内部产品图修改与确认（可选3D打印效果验证）';
        m.r='Wind / Franklin';
        m.rule='收到产品图后尽快；必要时同步3D打印查看外形效果';
      }
      if(m.name==='首样粗胚制作并寄送'){
        m.name='首样粗胚制作（寄送可选）';
        m.rule='Design Brief后2周；是否寄送根据项目需要决定';
      }
    });
    (p.variants||[]).forEach(function(v){
      if(Array.isArray(v.milestones))v.milestones=v.milestones.filter(function(m){return m.phase!=='cost'&&m.name!=='成本估算与利润分析'&&m.name!=='大货方案与成本最终签署';});
      if(v.node==='内部产品图修改与确认'){v.node='内部产品图修改与确认（可选3D打印效果验证）';v.r='Wind / Franklin';}
      if(v.node==='首样粗胚制作并寄送')v.node='首样粗胚制作（寄送可选）';
      if(!Array.isArray(v.milestones)||!v.milestones.length){
        var currentIndex=p.milestones.findIndex(function(m){var base=m.name.split('（')[0];return m.name===v.node||m.name.indexOf(v.node)>=0||v.node.indexOf(base)>=0||(isLegacyTestName(m.name)&&isLegacyTestName(v.node));});
        var inferredCurrent=currentIndex<0;
        if(currentIndex<0)currentIndex=Math.max(0,Math.min(p.milestones.length-1,Math.round((Number(v.progress)||0)/100*(p.milestones.length-1))));
        v.milestones=p.milestones.map(function(m,i){
          var item=clone(m);if(inferredCurrent&&i===currentIndex)item.inferredCurrent=true;item.status=i<currentIndex?'已完成':i===currentIndex?v.status:'未开始';if(i===currentIndex){item.r=v.r||item.r;item.a=v.a||item.a;}item.due=i===currentIndex?(v.due||''):'';item.actual='';item.next=i===currentIndex?(v.next||v.approval||''):'';return item;
        });
      }else{
        p.milestones.forEach(function(template){if(!v.milestones.some(function(m){return m.id===template.id||m.name===combinedTest&&(isLegacyTestName(template.name)||template.name===legacyFeedback);})){var item=clone(template);item.status='未开始';item.due='';item.actual='';item.next='';v.milestones.push(item);}});
      }
      if(v.node==='成本估算与利润分析'||v.node==='大货方案与成本最终签署'){
        var fallback=v.milestones.find(function(m){return m.status!=='已完成'&&m.status!=='不适用';})||v.milestones[v.milestones.length-1];
        if(fallback){v.node=fallback.name;v.status=fallback.status;v.r=fallback.r;v.a=fallback.a;v.due=fallback.due||'';v.next=fallback.next||'';v.approval=v.next||'—';}
      }
      migrateTestingWorkflow(v);
      v.progress=milestoneProgress(v.milestones);

  function scheduleMilestones(items,releaseDate){
    clearGeneratedDates(items);
    var deadline=calendarDay(releaseDate);
    if(deadline===null)return;
    var byId=new Map(items.filter(function(m){return m.status!=='不适用';}).map(function(m){return [m.id,m];}));
    var plans=new Map(),visiting=new Set();
    function plan(id){
      if(plans.has(id))return plans.get(id);
      if(visiting.has(id))throw Error('Circular milestone dependency: '+id);
      visiting.add(id);
      var due=deadline;
      Object.keys(RELEASE_PLAN).forEach(function(key){
        if(RELEASE_PLAN[key].after.includes(id))due=Math.min(due,plan(key).start);
      });
      var rule=RELEASE_PLAN[id],days=byId.has(id)?rule.days:0;
      var result={start:due-days,due:due};
      visiting.delete(id);plans.set(id,result);
      return result;
    }
    Object.keys(RELEASE_PLAN).forEach(plan);
    items.forEach(function(m){
      if(!openMilestone(m)||!plans.has(m.id))return;
      var target=plans.get(m.id);
      m.releaseSchedule={originalDue:m.due||'',generatedDue:fromDay(target.due),start:fromDay(target.start)};

    });

  window.bindPortfolioDrag=function(scroller){
    if(!scroller||scroller.dataset.dragBound==='1')return;scroller.dataset.dragBound='1';
    var active=false,startX=0,startLeft=0,moved=false,suppressClick=false;
    scroller.addEventListener('pointerdown',function(e){
      if(e.pointerType!=='mouse'||e.button!==0||scroller.scrollWidth<=scroller.clientWidth)return;
      active=true;moved=false;startX=e.clientX;startLeft=scroller.scrollLeft;
    });
    scroller.addEventListener('pointerleave',function(){if(!moved)active=false;});
    scroller.addEventListener('pointermove',function(e){
      if(!active)return;
      if(!(e.buttons&1)){finish(e);return;}
      var delta=e.clientX-startX;
      if(!moved&&Math.abs(delta)>4){
        moved=true;scroller.classList.add('dragging');scroller.setPointerCapture(e.pointerId);
      }
      if(moved){e.preventDefault();scroller.scrollLeft=startLeft-delta;}
    });
    function finish(e){if(!active)return;active=false;scroller.classList.remove('dragging');if(scroller.hasPointerCapture&&scroller.hasPointerCapture(e.pointerId))scroller.releasePointerCapture(e.pointerId);if(moved){suppressClick=true;setTimeout(function(){suppressClick=false;},80);}}
    scroller.addEventListener('pointerup',finish);scroller.addEventListener('pointercancel',finish);
    scroller.addEventListener('click',function(e){if(suppressClick){e.preventDefault();e.stopPropagation();}},true);
  };

  function updateVariantWorkflow(project,variant,previous,selection){
    var byId=new Map(variant.milestones.map(function(m){return [m.id,m];}));
    var ordered=project.milestones.map(function(m){return byId.get(m.id);}).filter(Boolean);
    var known=new Set(ordered);
    variant.milestones.forEach(function(m){if(!known.has(m))ordered.push(m);});
    var linked=selection&&selection.summary.node===variant.node?byId.get(selection.id):byId.get(variant.currentMilestoneId);
    if(!linked||linked.name!==variant.node){
      var matches=ordered.filter(function(m){return m.name===variant.node;});
      linked=matches.length===1?matches[0]:null;
    }
    if(linked){
      variant.currentMilestoneId=linked.id;
      var prior=previous.milestones.find(function(m){return m.id===linked.id;});
      var baseline=selection&&selection.id===linked.id?selection.summary:previous;
      if(prior){
        ['r','a','due','next'].forEach(function(key){
          if(variant[key]!==baseline[key]&&linked[key]===prior[key])linked[key]=variant[key];
        });
        if(linked.status===prior.status&&(variant.status!==baseline.status||variant.status==='已完成'))linked.status=variant.status;
      }
      if(openMilestone(linked)){
        Object.assign(variant,milestoneSummary(linked));
      }else{
        var next=ordered.slice(ordered.indexOf(linked)+1).find(openMilestone)||ordered.find(openMilestone);
        if(next){
          Object.assign(variant,milestoneSummary(next),{currentMilestoneId:next.id,approval:next.approval||'—'});
        }
      }
    }else{
      delete variant.currentMilestoneId;
      if(variant.status==='已完成'){
        var first=ordered.find(openMilestone);
        if(first)Object.assign(variant,milestoneSummary(first),{currentMilestoneId:first.id,approval:first.approval||'—'});
      }
    }
    if(ordered.length&&!ordered.some(openMilestone)){
      var completed=ordered.some(function(m){return m.status==='已完成';});
      Object.assign(variant,{node:completed?'全部里程碑已完成':'无适用里程碑',status:completed?'已完成':'不适用',due:'',next:'',approval:'—'});
      delete variant.currentMilestoneId;
    }
    variant.progress=milestoneProgress(variant.milestones);
  }

    }

      var nameField=document.querySelector('[data-variant-field="name"]');

      add(s.family,s.sample,s.owner,s.status,[['承诺日期',s.due],['记录更新',s.updated]],dashboardAction('openSample',[s.id]));
    });
    return out.sort(function(a,b){return a.date.localeCompare(b.date)||a.series.localeCompare(b.series);});
  }

  // Local preview of the server's daily reminder rules. This does not send email.
  var reminderPreviewDate='2026-11-22';
  function reminderPreviewHtml(){
    var english=window.DASHBOARD_LANG==='en', day=calendarDay(reminderPreviewDate);
    var inbox=new Map(), phases=english?['2 days remaining','Due today','1 day overdue']:['还有 2 天到期','今天到期','已超期 1 天'];
    function queue(names, due, subject, detail){
      var deadline=calendarDay(due);
      if(deadline===null)return;
      var phase=[2,0,-1].indexOf(deadline-day);
      if(phase<0)return;
      approverNames(names).forEach(function(name){
        if(!inbox.has(name))inbox.set(name,[]);
        inbox.get(name).push({phase:phase,subject:subject,detail:detail,due:fromDay(deadline)});
      });
    }
    seriesState.forEach(function(project){
      project.variants.forEach(function(variant){
        var active=['未开始','进行中','待签署','阻塞','已延误','开模中','制作中'];
        if(active.includes(variant.status)){
          queue(variant.r||variant.a||project.owner,variant.due,project.name+' · '+variant.name+' · '+t(variant.node),variant.next||variant.approval);
        }
      });
      project.approvals.forEach(function(approval){
        if(approval.status==='待确认'){
          queue(approval.approver,approval.needed,project.name+' · '+confirmationTitle(approval),approval.impact);
        }
      });
    });
    var entries=Array.from(inbox).sort(function(a,b){return a[0].localeCompare(b[0]);});
    return '<section class="report-section reminder-demo"><h3>'+(english?'Reminder email preview':'提醒邮件预览')+'</h3>'+
      '<p>'+(english?'Simulates one daily run for current milestones and pending confirmations. No email is sent.':'模拟每日检查当前里程碑和待确认事项。同一人合并成一封，仅预览，不发送。')+'</p>'+
      '<div class="report-form"><label>'+(english?'Simulated date':'模拟运行日期')+'<input type="date" id="reminderPreviewDate" value="'+reminderPreviewDate+'"></label></div>'+
      (!entries.length?'<p class="report-empty">'+(english?'No reminders match this date.':'当天没有符合条件的提醒。')+'</p>':entries.map(function(entry){
        var name=entry[0], items=entry[1].sort(function(a,b){return b.phase-a.phase;});
        return '<details class="reminder-message"><summary>'+esc(name)+' · '+(english?items.length+' item(s)':items.length+' 项提醒')+'</summary>'+
          '<p><b>'+(english?'Subject: Armstrong project reminders':'主题：Armstrong 项目到期提醒')+'</b></p><ul>'+
          items.map(function(item){return '<li><b>'+esc(item.subject)+'</b><br><span>'+phases[item.phase]+' · '+item.due+'</span>'+
            (item.detail&&item.detail!=='—'?'<br>'+esc(t(item.detail)) : '')+'</li>';}).join('')+'</ul></details>';
      }).join(''))+'</section>';
  }
  function reportsHtml(){
    var sections=['已完成','延误或阻塞','等待确认中','正在推进'],data=reportData();
    return '<section class="panel report-panel workspace-section"><div class="panel-head workspace-section-head"><div><h2>日报 / 周报</h2><p>按计划、提交或更新时间列出范围内的记录。状态以当前看板为准。</p><p data-i18n-zh="已完成事项按实际完成日期收录。" data-i18n-en="Completed milestones are listed by actual completion date.">已完成事项按实际完成日期收录。</p></div></div>'+
      '<form id="reportForm" class="report-form"><button type="button" class="btn" data-period="day" aria-pressed="'+(reportPeriod==='day')+'">今日日报</button>'+
      '<button type="button" class="btn" data-period="week" aria-pressed="'+(reportPeriod==='week')+'">本周周报</button>'+
      '<label>开始日期<input type="date" name="start" max="'+reportEnd+'" value="'+reportStart+'" required></label>'+
      '<label>结束日期<input type="date" name="end" min="'+reportStart+'" value="'+reportEnd+'" required></label>'+
      '<button class="btn" type="submit">应用日期</button></form>'+
      sections.map(function(group){
        var list=data.filter(function(item){return item.group===group;});
        return '<section class="report-section"><h3><span>'+group+'</span> <span class="report-count">'+list.length+'</span></h3>'+
          (list.length?'<div class="table-shell"><table class="report-table"><thead><tr><th>产品系列</th><th>事项</th><th>负责人</th><th>日期及来源</th><th>状态</th></tr></thead><tbody>'+
          list.map(function(item){return '<tr><td>'+esc(item.series)+'</td><td><button type="button" class="series-detail-link" '+item.action+'>'+esc(item.details)+'</button></td><td>'+esc(item.owner||'—')+'</td><td><time>'+item.date+'</time><small>'+item.basis+'</small></td><td><span class="status '+statusClass(item.status)+'">'+esc(item.status)+'</span></td></tr>';}).join('')+
          '</tbody></table></div>':'<p class="report-empty">该时段无匹配事项</p>')+'</section>';
      }).join('')+reminderPreviewHtml()+'</section>';
  }
  var main=document.getElementById('main');
  main.addEventListener('change',function(event){
    if(event.target.id!=='reminderPreviewDate'||calendarDay(event.target.value)===null)return;
    reminderPreviewDate=event.target.value;
    renderDashboardResults();
  });
  main.addEventListener('click',function(event){
    var control=event.target.closest('[data-period]');
    if(control){setReportPeriod(control.dataset.period);renderDashboardResults();}
  });
  main.addEventListener('input',function(event){
    var form=event.target.form;
    if(!form||form.id!=='reportForm')return;
    form.elements.start.max=form.elements.end.value;
    form.elements.end.min=form.elements.start.value;
  });
  main.addEventListener('submit',function(event){
    if(event.target.id!=='reportForm')return;
    event.preventDefault();
    var start=event.target.elements.start.value,end=event.target.elements.end.value;
    if(calendarDay(start)===null||calendarDay(end)===null||start>end)return;
    reportStart=start;reportEnd=end;reportPeriod='custom';renderDashboardResults();
  });
  function reapplyLang(){if(window.applyDashboardLanguage)window.applyDashboardLanguage(document);}
  var matrixLayout='list';
  window.setSharedFilter=function(id,value){
    var select=document.getElementById(id);if(!select)return;
    select.value=value;select.dispatchEvent(new Event('change'));
  };
  window.setMatrixLayout=function(value){matrixLayout=value==='grid'?'grid':'list';renderDashboardResults();};
  function renderSharedFilters(){
    var controls=document.getElementById('sharedFilterChips');
    if(!controls){controls=document.createElement('div');controls.id='sharedFilterChips';controls.className='shared-filter-chips';document.getElementById('workspaceFilters').appendChild(controls);}
    var english=window.DASHBOARD_LANG==='en';
    controls.innerHTML=['businessFilter','seriesStatusFilter','priorityFilter','prioritySort'].map(function(id){
      var select=document.getElementById(id),label=document.querySelector('label[for="'+id+'"]');
      var selected=select.options[select.selectedIndex];
      return '<details class="shared-filter'+(select.selectedIndex>0?' active':'')+'"><summary>'+esc(label?label.textContent:'')+'<span>'+esc(selected?selected.textContent:'')+'</span></summary><div class="shared-filter-menu">'+Array.from(select.options).map(function(option){return '<button type="button" aria-pressed="'+option.selected+'" '+dashboardAction('setSharedFilter',[id,option.value])+'>'+esc(option.textContent)+'</button>';}).join('')+'</div></details>';
    }).join('')+portfolioDateFilterHtml()+'<button type="button" class="btn ghost" onclick="document.getElementById(\'workspaceReset\').click()">'+(english?'Clear filters':'清除筛选')+'</button>';
  }
  function decorateSharedTables(){
    document.querySelectorAll('.matrix-view-tools').forEach(function(tools){tools.remove();});
    document.querySelectorAll('#main table,#drawerBody table').forEach(function(table){
      var headers=Array.from(table.querySelectorAll('thead th'));
      var labels=headers.map(function(th){return th.textContent.trim();});
      // One column contract for the heading and every body cell, in either language.
      // Text/people stay left; dates, counts, status and actions share a center axis.
      var centered=/^(提交日期|需要日期|计划日期|实际日期|承诺日期|计划完成日|下一截止日|下一节点|已等待|数量|状态|系列状态|操作|里程碑完成度|整体进度|进度|完成度|submitted|submitted date|submission date|needed by|required date|planned date|actual date|committed date|next milestone|next due date|waiting|quantity|qty|status|series status|actions?|milestone progress|milestone completion|overall progress|progress)$/i;
      var alignments=headers.map(function(th){
        var align=centered.test(th.textContent.trim())||th.classList.contains('cell-center')||th.classList.contains('overview-center')||th.classList.contains('table-status-cell')?'center':'left';
        th.dataset.columnAlign=align;
        return align;
      });
      table.querySelectorAll('tbody tr').forEach(function(row){
        Array.from(row.children).forEach(function(cell,index){
          if(cell.colSpan>1)return;
          cell.dataset.label=labels[index]||'';
          cell.dataset.columnAlign=alignments[index]||'left';
          cell.classList.toggle('empty-matrix-cell',table.closest('.matrix')!==null&&index===0&&!cell.textContent.trim());
        });
      });
    });
    var matrix=document.querySelector('#main .matrix');
    if(matrix){
      matrix.classList.toggle('table-as-cards',matrixLayout==='grid');
      var count=matrix.querySelectorAll('tbody tr:not(.phase-row):not(:has(.gate-empty))').length;
      var tools=document.createElement('div');tools.className='matrix-view-tools';
      var english=window.DASHBOARD_LANG==='en';
      tools.innerHTML='<span>'+count+(english?' entries':' 条记录')+'</span><div class="view-segment"><button type="button" aria-pressed="'+(matrixLayout==='grid')+'" '+dashboardAction('setMatrixLayout',['grid'])+'>'+(english?'Grid':'网格')+'</button><button type="button" aria-pressed="'+(matrixLayout==='list')+'" '+dashboardAction('setMatrixLayout',['list'])+'>'+(english?'List':'列表')+'</button></div>';
      matrix.before(tools);
    }
  }
  window.setView=function(v){
    if(v==='matrix')v='overview'; // Retired standalone route; milestone history remains in project details.
    view=v;dashboardFilter='all';gateApproverFilter='';gateSeriesFilter='';syncOverviewTabs();render();
    window.scrollTo(0,0);
  };
  window.searchDashboardProjects=function(value){
    writeDashboardPreference('foil_dashboard_search',value);
    if(view!=='overview'){view='overview';syncOverviewTabs();render();}
    else renderDashboardResults();
  };
  new MutationObserver(function(){decorateSharedTables();}).observe(document.getElementById('drawerBody'),{childList:true,subtree:true});
  window.renderDashboardResults=function(){
    document.body.dataset.workspaceView=view;
    syncOverviewTabs();
    var headings={confirmations:['确认中心','集中查看确认事项、等待时间与人员积压。'],overview:['项目健康度总览','追踪项目进度，识别风险，让团队的每一步清晰可见。'],matrix:['里程碑工作台','按型号查看完整流程、负责人、日期和下一步动作。'],reports:['日报 / 周报','按日期汇总进展、风险与待确认事项。'],samples:['样品计划','按图档与生产状态跟进各尺寸样品。']};
    var heading=headings[view]||headings.overview;
    document.getElementById('workspaceTitle').textContent=t(heading[0]);
    document.getElementById('workspaceSubtitle').textContent=t(heading[1]);
    document.getElementById('workspaceNewProject').hidden=view!=='overview'||!canManageProjects();
    if(view==='overview')renderExecutiveFocus();
    main.innerHTML=view==='samples'?samplePlanHtml():view==='matrix'?matrixHtml():view==='reports'?reportsHtml():view==='confirmations'?confirmationCenterHtml():overviewHtml();
    reapplyLang();
    renderSharedFilters();
    decorateSharedTables();
  };
  window.render=function(){
    renderSidebarProjects();
    var overview=view==='overview'||view==='matrix';
    document.getElementById('priorityControls').hidden=!overview;
    document.getElementById('workspaceFilters').hidden=view!=='overview';
    document.getElementById('globalSnapshot').hidden=view!=='overview';
    var focusEl=document.getElementById('executiveFocus');
    if(focusEl)focusEl.hidden=view!=='overview';
    document.getElementById('confirmationLoadSummary').hidden=true;
    presentationHome.hidden=!presentationState||view==='overview';
    if(overview)renderStats();
    renderDashboardResults();
  };
  var presentationState=null,ownedFullscreen=false;
  var presentationToggle=document.getElementById('presentationToggle');
  var presentationHome=document.getElementById('presentationHome');
  var projectSearch=document.getElementById('search');

  function setPresentationLabel(active){
    presentationToggle.setAttribute('aria-pressed',String(active));
    presentationToggle.textContent=t(active?'退出演示':'演示模式');
  }
  function exitNativeFullscreen(){
    if(document.fullscreenElement&&document.exitFullscreen){
      document.exitFullscreen().catch(function(){});
    }
  }
  function enterPresentation(){
    if(presentationState)return;
    var session={
      readOnly:READ_ONLY,view:view,filter:dashboardFilter,approver:gateApproverFilter,series:gateSeriesFilter,
      line:lineFilter,status:statusFilter,priority:priorityFilter,sort:prioritySort,
      sampleFamily:sampleFamilyFilter,sampleStatus:sampleFilter,
      search:projectSearch.value,scrollX:window.scrollX,scrollY:window.scrollY
    };
    presentationState=session;
    closeDrawer();
    READ_ONLY=true;
    document.body.classList.add('presentation-mode','readonly-dashboard');
    document.body.classList.remove('pm-mode');
    view='overview';dashboardFilter='all';gateApproverFilter='';gateSeriesFilter='';
    lineFilter='';statusFilter='';priorityFilter='';prioritySort=false;projectSearch.value='';
    setPresentationLabel(true);
    syncOverviewTabs();render();window.scrollTo(0,0);
    if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().then(function(){
        if(presentationState===session)ownedFullscreen=true;
        else if(!presentationState)exitNativeFullscreen();
      }).catch(function(){});
    }
  }
  function leavePresentation(){
    if(!presentationState)return;
    var session=presentationState,shouldExitFullscreen=ownedFullscreen;
    presentationState=null;
    ownedFullscreen=false;
    closeDrawer();
    READ_ONLY=session.readOnly;
    document.body.classList.remove('presentation-mode');
    document.body.classList.toggle('readonly-dashboard',READ_ONLY);
    document.body.classList.toggle('pm-mode',!READ_ONLY);
    view=session.view;dashboardFilter=session.filter;gateApproverFilter=session.approver;gateSeriesFilter=session.series;
    lineFilter=session.line;statusFilter=session.status;priorityFilter=session.priority;prioritySort=session.sort;
    sampleFamilyFilter=session.sampleFamily;sampleFilter=session.sampleStatus;
    lineSelect.value=lineFilter;statusSelect.value=statusFilter;prioritySelect.value=priorityFilter;
    sortSelect.value=prioritySort?'priority':'status';projectSearch.value=session.search;
    setPresentationLabel(false);
    syncOverviewTabs();render();
    presentationToggle.focus({preventScroll:true});
    window.scrollTo(session.scrollX,session.scrollY);
    if(shouldExitFullscreen)exitNativeFullscreen();
  }
  presentationToggle.addEventListener('click',function(){
    if(presentationState)leavePresentation();
    else enterPresentation();
  });
  presentationHome.addEventListener('click',function(){setView('overview');window.scrollTo(0,0);});
  document.addEventListener('fullscreenchange',function(){
    if(presentationState&&ownedFullscreen&&!document.fullscreenElement)leavePresentation();
  });
  document.addEventListener('keydown',function(event){
    if(!presentationState||event.key!=='Escape'||document.fullscreenElement)return;
    event.preventDefault();
    if(document.getElementById('mask').classList.contains('show'))closeDrawer();
    else leavePresentation();
  });

  var teamIdentity=document.getElementById('teamIdentity');
  var teamRoles={viewer:['只读','Viewer'],pm:['项目维护','Project Manager'],admin:['管理员','Administrator']};
  var teamRole=teamRoles[TEAM.role];
  document.getElementById('workspaceAccountName').textContent=TEAM.name;
  document.getElementById('workspaceAccountRole').dataset.i18nZh=teamRole[0];
  document.getElementById('workspaceAccountRole').dataset.i18nEn=teamRole[1];
  document.getElementById('workspaceAccountRole').textContent=window.DASHBOARD_LANG==='en'?teamRole[1]:teamRole[0];
  document.getElementById('workspaceAvatar').textContent=String(TEAM.name||'AF').slice(0,2).toUpperCase();
  teamIdentity.dataset.i18nZh=TEAM.name+' · '+teamRole[0];
  teamIdentity.dataset.i18nEn=TEAM.name+' · '+teamRole[1];
  teamIdentity.textContent=window.DASHBOARD_LANG==='en'?teamIdentity.dataset.i18nEn:teamIdentity.dataset.i18nZh;
  document.getElementById('teamLogout').onclick=async function(){
    try{
      var response=await fetch(window.ARMSTRONG_API_BASE+'/api/logout',{method:'POST',headers:{'X-CSRF-Token':TEAM.csrf,'Authorization':'Bearer '+window.ARMSTRONG_SESSION_TOKEN}});
      if(!response.ok&&response.status!==401)throw Error('logout');
    }catch(error){}
    try{sessionStorage.removeItem(window.ARMSTRONG_SESSION_KEY||'armstrong_shared_session_v1');}catch(e){}
    location.replace(location.pathname);
  };
  projectSearch.value=readDashboardPreference('foil_dashboard_search')||'';
  var topbarActions=document.getElementById('topbarActions');
  document.addEventListener('click',function(event){
    if(topbarActions.open&&!topbarActions.contains(event.target))topbarActions.open=false;
  });
  document.addEventListener('keydown',function(event){
    if(event.key==='Escape'&&topbarActions.open){
      topbarActions.open=false;event.preventDefault();event.stopImmediatePropagation();
      topbarActions.querySelector('summary').focus({preventScroll:true});
    }
  },true);
  render();
  var query=new URLSearchParams(location.search);
  var requestedView=query.get('view');
  var requestedSample=query.get('sample');
  var requested=query.get('open');
  var requestedVariant=query.get('variant');
  var requestedNew=query.get('new');
  if(requestedNew==='1'&&!READ_ONLY)openNewProject();
  else if(requestedView==='samples'){setView('samples');if(requestedSample)openSample(requestedSample);}
  else if(requestedView==='reports'||requestedView==='matrix'||requestedView==='confirmations')setView(requestedView);
  else if(requested&&requestedVariant) openVariant(requested,requestedVariant);
  else if(requested) openProject(requested);
})();


</script>
